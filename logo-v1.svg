<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 56" role="img" aria-label="Sharma Group">
  <title>Sharma Group — Logo V1 (Mark + Wordmark)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
      .sg-wordmark { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
      .sg-sub      { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- ── MARK: Dual-stroke building peak ── -->
  <!-- Left stroke — warm white -->
  <line x1="3"  y1="49" x2="20" y2="7"
        stroke="#EDE8DF" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right stroke — amber -->
  <line x1="20" y1="7"  x2="37" y2="49"
        stroke="#C8903A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Base line — amber, very subtle -->
  <line x1="3"  y1="49" x2="37" y2="49"
        stroke="#C8903A" stroke-width="1" stroke-linecap="round" opacity=".35"/>

  <!-- ── SEPARATOR ── -->
  <line x1="51" y1="11" x2="51" y2="45"
        stroke="#252D32" stroke-width="1"/>

  <!-- ── WORDMARK ── -->
  <!-- SHARMA -->
  <text x="62" y="33"
        class="sg-wordmark"
        font-size="28" font-weight="700"
        fill="#EDE8DF"
        letter-spacing="-0.4">SHARMA</text>
  <!-- GROUP -->
  <text x="62.5" y="49"
        class="sg-sub"
        font-size="10" font-weight="500"
        fill="#C8903A"
        letter-spacing="3.8">GROUP</text>
</svg>
